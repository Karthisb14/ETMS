services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${ETMS_DB_PASSWORD}
    ports:
      - "1433:1433"
    volumes:
      - etms-db-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$ETMS_DB_PASSWORD\" -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: "Production"
      ConnectionStrings__Etms: Server=db,1433;Database=Etms;User Id=sa;Password=${ETMS_DB_PASSWORD};TrustServerCertificate=True
    depends_on:
      db:
        condition: service_healthy

volumes:
  etms-db-data:
